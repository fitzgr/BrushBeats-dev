<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brush Beats Lab — Brushing Flow</title>
    <link rel="stylesheet" href="flow.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>Brush Beats Lab — Brushing Flow</h1>
          <p class="subtitle">Experiment A: Three-step brushing animation with eight possible starting points. <a href="two-panel.html">View experiment B: two-panel teeth</a></p>
        </div>
        <div class="step-chip" id="stepCounter">Step 1 / 3</div>
      </header>

      <section class="control-panel">
        <div class="control-grid">
          <label class="field">
            <span>Row A teeth</span>
            <input id="topCountInput" type="number" min="1" max="16" value="16" />
          </label>

          <label class="field">
            <span>Row B teeth</span>
            <input id="bottomCountInput" type="number" min="1" max="16" value="16" />
          </label>

          <label class="field field-wide">
            <span>Start point</span>
            <select id="startPointSelect"></select>
          </label>
        </div>

        <div class="button-row">
          <button id="prevBtn" type="button">Back</button>
          <button id="playBtn" type="button">Play</button>
          <button id="nextBtn" type="button">Next</button>
          <button id="resetBtn" type="button">Reset</button>
        </div>
      </section>

      <main class="stage-card">
        <div class="stage-header">
          <div>
            <h2 id="stageTitle">Front view</h2>
            <p id="stageMeta">The animation begins with the full frontal layout.</p>
          </div>
          <div class="phase-strip" id="phaseStrip"></div>
        </div>

        <div class="stage-summary">
          <span class="summary-pill" id="startPointSummary">Front Top Left</span>
          <span class="summary-pill" id="teethSummary">16 top / 16 bottom teeth</span>
        </div>

        <div class="view-card stage-view" id="stageView"></div>

        <div class="step-info" id="stepLabel">Step 1: top or bottom</div>
      </main>
    </div>

    <script src="flow.js"></script>
  </body>
</html>
